[package]
name = "coordinator"
version = "0.1.0"
edition = "2021"

[features]
# If you have a working Rust libvips binding available/desired, enable "vips-rs".
vips-rs = []

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["full"] }
which = "4.4"
notify = "6.1"
rand = "0.8"
walkdir = "2.3"
warp = "0.3"
# optional libvips binding (feature gated)
# libvips = { version = "0.7", optional = true }
