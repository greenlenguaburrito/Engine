name: Build TruckNav APK

on:
  push:
    branches:
      - "**"
    paths:
      - "android/TruckNav/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: android/TruckNav

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          # `uses:` steps below (upload-artifact, action-gh-release) resolve paths
          # relative to GITHUB_WORKSPACE, not this job's working-directory default,
          # so this must be repo-root-relative, not just relative to this step's cwd.
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "path=android/TruckNav/$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TruckNav-debug-apk
          path: android/TruckNav/app/build/outputs/apk/debug/*.apk

      - name: Publish to a downloadable Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: truck-nav-debug
          name: "TruckNav (debug build)"
          body: |
            Auto-built from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.
            Download the `.apk` below and install it directly on your phone
            (you'll need to allow installs from your browser/file manager the first time).

            This is a debug build for personal use, not a signed release build.
          files: ${{ steps.apk.outputs.path }}
